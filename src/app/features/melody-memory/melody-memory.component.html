<div class="screen" [@shake]="isShaking()">

  <!-- ── Top bar ─────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <a class="topbar__back" routerLink="/" aria-label="Change level">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      Change level
    </a>

    @if (level(); as l) {
      <div class="topbar__level">
        <span class="topbar__level-name">{{ l.name }}</span>
        <span class="topbar__level-range">{{ l.rangeLabel }}</span>
      </div>
    }

    <div class="topbar__spacer"></div>
  </header>

  <!-- ── Stats panel ─────────────────────────────────────────────────────── -->
  <app-stats-panel
    [currentLength]="sequence().length"
    [sessionBest]="sessionBest()"
    [levelBest]="levelBest()"
    [allTimeBest]="allTimeBest()"
  />

  <!-- ── Status line ─────────────────────────────────────────────────────── -->
  <div class="status" [class]="'status status--' + gamePhase()" @fadeSlideIn>
    <span class="status__dot" aria-hidden="true"></span>
    <span class="status__text">{{ statusLabel() }}</span>
  </div>

  <!-- ── Keyboard + success burst overlay ───────────────────────────────── -->
  <div class="stage">
    <app-piano-keyboard
      [notes]="keyboardNotes()"
      [activeKey]="activeKey()"
      [errorKey]="errorKey()"
      [hintKey]="hintKey()"
      [disabled]="keyboardDisabled()"
      (keyPress)="onKeyPress($event)"
    />
    <app-success-burst [visible]="showSuccess()" />
  </div>

  <!-- ── Controls ────────────────────────────────────────────────────────── -->
  <div class="controls">
    <button
      type="button"
      class="btn btn--primary"
      [disabled]="!canStart()"
      (click)="start()"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5v14l11-7z"/>
      </svg>
      {{ sequence().length > 0 && gamePhase() !== 'idle' ? 'Restart' : 'Start' }}
    </button>

    <button
      type="button"
      class="btn btn--ghost"
      [disabled]="!canReplay()"
      (click)="replaySequence()"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
      Replay sequence
    </button>

    <button
      type="button"
      class="btn btn--ghost btn--danger"
      [disabled]="!canGiveUp()"
      (click)="giveUp()"
    >
      Give up
    </button>
  </div>

  <!-- ── Helper strip ────────────────────────────────────────────────────── -->
  <div class="helper">
    <span>Level pool: <strong>{{ poolSizeForLevel() }}</strong> notes</span>
    <span class="helper__sep">·</span>
    <span>Progress saves automatically</span>
  </div>

</div>
